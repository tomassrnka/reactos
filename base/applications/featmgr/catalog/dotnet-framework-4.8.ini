[Feature]
Id=dotnet-framework-4.8
Name=Microsoft .NET Framework 4.8
Description=Microsoft's .NET Framework 4.8 (the real CLR, not Mono): runs managed console, WinForms and WPF programs and compiles with csc/MSBuild. Install downloads the official offline installer from Microsoft (about 116 MB, SHA-256 checked) and runs it silently (/q /norestart); it takes a few minutes and about 1.5 GB of disk. The installer gets the Windows 7 SP1 answer from the compatibility database automatically, no layer to set. Disable runs the Framework's own uninstaller silently (/uninstall /q). i386 and amd64 (amd64 installs the 32-bit and the 64-bit Framework).
Tier=software
Version=4.8.4115
Dependencies=

[Install]
Provider=rapps

[Rapps]
Pkg=dotnet-framework-4.8
; RAPPS-format entry that ships next to this manifest (Catalog\dotnet-framework-4.8.txt); staged into the RAPPS
; database right before "rapps /install /S dotnet-framework-4.8" because the package is not in the online
; RAPPS database. UninstallCmd: the Framework's own uninstaller, silent. rapps /uninstall would start the command the
; Framework registers in Add/Remove Programs ("Setup.exe /repair /x86"), which opens the Repair/Remove dialog and
; waits for a click.
;   The Framework's setup, Setup.exe /uninstall /x86 /x64 /q /norestart, from its SetupCache\v4.8.03761 folder (under Framework
;   on i386, under Framework64 on amd64). On amd64 it needs the WoW64 registry view fix of a relative open from a
;   KEY_WOW64_64KEY handle (MsiGetPatchInfoEx finds the .NET 4.8 update, KB4503575, only if the 32-bit Setup.exe could
;   register it in the 64-bit view); before that it ended with success and removed nothing.
; A later 4.8.x installer that changes the SetupCache folder name or the MSI product code needs these lines and the
; Version bump below.
Entry=%SystemRoot%\Featmgr\Catalog\dotnet-framework-4.8.txt
UninstallCmd.x86=%SystemRoot%\Microsoft.NET\Framework\v4.0.30319\SetupCache\v4.8.03761\Setup.exe /uninstall /x86 /x64 /q /norestart
UninstallCmd.amd64=%SystemRoot%\Microsoft.NET\Framework64\v4.0.30319\SetupCache\v4.8.03761\Setup.exe /uninstall /x86 /x64 /q /norestart

; The installer is NOT in the source tree or the image: rapps downloads it from Microsoft at install time
; (the fwlink go.microsoft.com/fwlink/?linkid=2088631 "offline installer" of the .NET 4.8 download page redirects
; to the file below) and verifies the SHA-256 below (and the SHA1, same file) before running it.
; /q /norestart is the installer's own unattended mode. The "Windows 7 SP1" answer the installer needs is applied to it
; by the application compatibility database (media\sdb\sysmain.xml), not by this entry.
; Version bump (manual, no auto-discovery): take the new offline installer of 4.8.x from
; https://dotnet.microsoft.com/download/dotnet-framework and change, here: Version=, Artifact=, ArtifactSHA256=,
; SizeBytes=; and in Catalog\dotnet-framework-4.8.txt: Version, URLDownload (both sections), SHA256, SHA1 (sha1sum of the
; verified file), SizeBytes. Keep both files identical; then re-run the featmgr dotnet48 live test.
[Source]
