[Feature]
Id=powershell-7
Name=PowerShell 7 (LTS)
Description=Microsoft's cross-platform PowerShell (pwsh), 7.4 LTS. Install downloads the official x64 MSI from the PowerShell GitHub release (about 105 MB, SHA-256 checked) and runs it silently: adds pwsh to the system PATH and the Start-menu shortcut. PowerShell remoting, the Microsoft Update opt-in and Explorer context-menu entries are left off. amd64 only.
Tier=software
Version=7.4.22
Dependencies=

[Install]
Provider=rapps

[Rapps]
Pkg=powershell-7
; RAPPS-format entry that ships next to this manifest (Catalog\powershell-7.txt); staged into the RAPPS
; database right before "rapps /install /S powershell-7" because the package is not in the online
; RAPPS database. UninstallName: the MSI's ProductName (Add/Remove Programs name); rapps resolves it
; from the registry and runs "msiexec /x{ProductCode} /qn", so uninstall needs no stored product code
; and keeps working across a version bump.
Entry=%SystemRoot%\Featmgr\Catalog\powershell-7.txt
UninstallName=PowerShell 7-x64

; Why the MSI is run with PWRSHPLUGIN_VERSION=1 (see the MsiProperties line in powershell-7.txt):
; the stock MSI has a launch condition that looks for %WINDIR%\System32\pwrshplugin.dll (the WinRM
; remoting plugin from WMF 4+), which nitro does not ship (no WSMan). The property is the MSI's own
; public, documented way to waive that prerequisite; it only matters for PowerShell remoting, which is
; also kept off (ENABLE_PSREMOTING=0). Nothing is faked: no placeholder DLL, no registry key.
;
; The package is NOT in the source tree or the image: rapps downloads it from the PowerShell release
; on GitHub at install time and verifies the SHA-256 below (and the SHA1, same file) before running it.
; Version bump (manual, no auto-discovery): take the new 7.4.x LTS from
; https://github.com/PowerShell/PowerShell/releases (asset hashes.sha256, or the asset's digest) and change,
; here: Version=, Artifact= (URL carries the version), ArtifactSHA256=, SizeBytes=; and in
; Catalog\powershell-7.txt: Version, URLDownload, SHA256, SHA1 (sha1sum of the verified file), SizeBytes.
; Keep both files identical; then re-run the featmgr live install test.
[Source]
Artifact=https://github.com/PowerShell/PowerShell/releases/download/v7.4.22/PowerShell-7.4.22-win-x64.msi
ArtifactSHA256=78e819df51a672fba8362258a19db0e681452dcee6fee63c60bcb5aa45d1b859
SizeBytes=110120960
Arch=amd64
Publisher=Microsoft Corporation
URLSite=https://github.com/PowerShell/PowerShell
License=MIT (PowerShell). Not redistributed by ReactOS-Nitro: downloaded from the official PowerShell release at install time.
