[Feature]
Id=gl-sw-pack
Name=OpenGL Software Renderer Pack
Description=Registers the in-box ReactOS software OpenGL implementation as the forced GL ICD (HKCU\Software\ReactOS\OpenGL) and installs the pack marker. Reversible. This is the same custom-ICD registration path the full lavapipe GPU pack uses.
Tier=os
Version=1.0.0
Dependencies=

[Payload]
File0=glsw-pack.txt|%SystemRoot%\System32\nitro-glsw-pack.txt

[Registry]
Reg0=HKCU|Software\ReactOS\OpenGL|@|REG_SZ|ReactOS Software Implementation
