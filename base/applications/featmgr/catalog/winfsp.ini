[Feature]
Id=winfsp
Name=WinFsp (user-mode filesystems)
Description=FUSE-like user-mode filesystem framework (WINFSP-A/B). Installs the WinFsp file-system driver (winfsp-x64.sys, registered as the on-demand "WinFsp" service and started), the user-mode library winfsp-x64.dll, and the memfs RAM-filesystem sample (memfs-x64.exe -m Z:  or  -m \\memfs\share). Disable stops and removes the driver. ~0.2 MB hosted payload, see [Source]; amd64 only.
Tier=os
Version=2.0
Dependencies=

; The payload is NOT in the source tree or the image. Stage it with
; tools/stage-winfsp-payload.sh (fetches Artifact, checks SHA256) into
; %SystemRoot%\Featmgr\Payload\winfsp\ ; until then the feature is listed as
; deferred and enable is refused.
[Source]
Artifact=s3://reactos-nitro-archive/winfsp-x64/winfsp-x64-artifacts.tar.xz
ArtifactSHA256=65a914de54eb5fbae0cd7edf3abd7a1686aa112489d097ee4b4e350b70d00c60
SizeBytes=224136
Arch=amd64
License=WinFsp: GPLv3 with FLOSS exception (Bill Zissimopoulos); unmodified binaries from the official WinFsp 2.0 MSI, notice travels with the pack

[Payload]
File0=winfsp-x64.sys|%SystemRoot%\System32\drivers\winfsp-x64.sys
File1=winfsp-x64.dll|%SystemRoot%\System32\winfsp-x64.dll
File2=memfs-x64.exe|%SystemRoot%\System32\memfs-x64.exe
File3=winfsp-licenses.txt|%SystemRoot%\System32\winfsp-licenses.txt

[Registry]
; WinFsp's FspLoad() looks here for the install directory
Reg0=HKLM|SOFTWARE\WinFsp|InstallDir|REG_SZ|%SystemRoot%\System32

[Service]
; Name|Type|StartType|ImagePath|DisplayName|Run(1=start now). On-demand: the
; WinFsp DLL / launcher starts it when a filesystem mounts.
Svc0=WinFsp|filesys|demand|system32\drivers\winfsp-x64.sys|WinFsp|1
