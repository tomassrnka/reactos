[Feature]
Id=lavapipe-pack
Name=GPU Pack (Mesa lavapipe/llvmpipe)
Description=Multi-core software Vulkan 1.4 (Mesa lavapipe) + LLVM-JIT OpenGL (llvmpipe), GFX-01. Registers the ICD with the in-box Khronos Vulkan loader (vulkan-1.dll, Apache-2.0, system32) and swaps the in-box softpipe libgallium_wgl.dll for llvmpipe (original restored on disable). 116 MB hosted payload, see [Source]; amd64 only.
Tier=os
Version=26.2.4
Dependencies=

; The payload is NOT in the source tree or the image. Stage it with
; tools/stage-lavapipe-payload.sh (fetches Artifact, checks SHA256) into
; %SystemRoot%\Featmgr\Payload\lavapipe-pack\ ; until then the feature is
; listed as deferred and enable is refused.
[Source]
Artifact=s3://reactos-nitro-archive/gfx01-lavapipe-amd64/gfx01-lavapipe-amd64-artifacts.tar.xz
ArtifactSHA256=6ab3d0fed744d5e9b9c2dca11c2d6a86ab1291533b49a6e693bb22729c84d345
SizeBytes=135000000
Arch=amd64
License=Mesa: MIT; Vulkan-Loader (in-box vulkan-1.dll): Apache-2.0, licence text in system32 as vulkan-loader-licenses.txt; LLVM: Apache-2.0 WITH LLVM-exception (+ legacy LLVM/zlib/GCC-runtime notices); separate DLLs = aggregation, licence texts travel with the pack

[Payload]
File0=vulkan_lvp.dll|%SystemRoot%\System32\vulkan_lvp.dll
File1=lvp_icd.json|%SystemRoot%\System32\lvp_icd.json
File2=libgallium_wgl.dll|%SystemRoot%\System32\libgallium_wgl.dll
File3=llvm-licenses.txt|%SystemRoot%\System32\lavapipe-pack-licenses\llvm-licenses.txt
File4=mesa3d-licenses.txt|%SystemRoot%\System32\lavapipe-pack-licenses\mesa3d-licenses.txt

[Registry]
; Khronos loader: value NAME = absolute manifest path, data 0 = enabled (same as syssetup RegisterVulkanIcds)
Reg0=HKLM|SOFTWARE\Khronos\Vulkan\Drivers|%SystemRoot%\System32\lvp_icd.json|REG_DWORD|0
