[Feature]
Id=scoop
Name=Scoop (command-line installer)
Description=Scoop (scoop.sh), a command-line installer for Windows apps and developer tools. Install fetches the official installer at install time (pinned to a reviewed commit and SHA-256 checked before it runs; needs PowerShell 7, which is installed first if missing), sets Scoop up machine-wide in C:\scoop and adds C:\scoop\shims to the system PATH. After 'featmgr /import-scoop' its apps are listed on the Software tab; each one installs with 'scoop install' and Scoop verifies every download against its manifest hash. Needs an NTFS volume (Scoop uses junctions). Uninstall removes Scoop and every app installed with it. amd64 only.
Tier=software
Version=rolling
Dependencies=powershell-7

[Install]
Provider=command
; The scripts ship in the image (this directory); the Scoop installer itself is downloaded when
; the feature is enabled. scoop-install.ps1 pins it: URL = a ScoopInstaller/Install commit, SHA-256
; checked before it is run. Bump the pin by hand (instructions at the top of the script).
Installer=%SystemRoot%\Featmgr\Catalog\scoop-install.ps1
SilentArgs=
UninstallScript=%SystemRoot%\Featmgr\Catalog\scoop-uninstall.ps1
; Installed iff the Scoop shim exists (so an install or removal done outside featmgr is seen).
; %SCOOPROOT% = machine SCOOP variable, else %SystemDrive%\scoop.
DetectPath=%SCOOPROOT%\shims\scoop.cmd
; Scoop builds its "current" version links with junctions: refuse on FAT before downloading anything.
RequireNtfs=%SCOOPROOT%\

[Source]
Artifact=https://raw.githubusercontent.com/ScoopInstaller/Install/1e2f334083d609986d8c8bc9e31ae8e87c39fab4/install.ps1
ArtifactSHA256=94f983b190438311e006b957db7c8422709e0ba62a6c2ac04e278164108f2512
Arch=amd64
Publisher=ScoopInstaller
URLSite=https://scoop.sh
License=Unlicense (the Scoop installer) / MIT (Scoop). Not redistributed by ReactOS-Nitro: downloaded at install time.
