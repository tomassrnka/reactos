[Feature]
Id=fmt-sw
Name=FEATMGMT test software (command provider)
Description=Test fixture: software tier, install != enable. Install runs the staged installer, disable runs its uninstaller.
Tier=software
Version=1.0
Dependencies=

[Install]
Provider=command
Installer=fmt-sw-setup.cmd
SilentArgs=/S
UninstallCmd=cmd.exe /c ""%PAYLOAD%\fmt-sw-uninst.cmd" /S"

[Source]
Artifact=https://example.invalid/fmt-sw.exe
ArtifactSHA1=0000000000000000000000000000000000000000

; software tier applies [Registry] after the installer succeeds and reverts it with the app
; (per-app configuration the installer cannot do, e.g. protocol handlers)
[Registry]
Reg0=HKLM|SOFTWARE\ReactOS\Nitro\FmTest|SwReg|REG_DWORD|7
