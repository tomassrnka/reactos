<?xml version="1.0" encoding="UTF-8"?>
<?xml-stylesheet type="text/css" href="palette.css"?>
<!-- AjarOS mark for dark grounds (the reverse of mark.svg): light frame, darker glass, the same warm light. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="c-white"/>
      <stop offset="1" class="c-mist"/>
    </linearGradient>
    <linearGradient id="glassL" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" class="c-sky"/>
      <stop offset="1" class="c-harbor"/>
    </linearGradient>
    <linearGradient id="glassR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="c-harbor"/>
      <stop offset="1" class="c-deep"/>
    </linearGradient>
    <radialGradient id="light" cx="0.25" cy="0.45" r="0.9">
      <stop offset="0" class="c-glow"/>
      <stop offset="1" class="c-lamp"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" class="c-ink" stop-opacity="0.35"/>
      <stop offset="1" class="c-ink" stop-opacity="0"/>
    </radialGradient>
  </defs>
    <!-- opening behind the casement: warm light -->
  <rect x="33" y="12" width="19" height="40" fill="url(#light)"/>
  <!-- left casement glass (closed) with a reflection band -->
  <rect x="12" y="12" width="19" height="40" fill="url(#glassL)"/>
  <path d="M12 30 L30.5 17.4 V23.4 L12 36 Z" class="f-white" opacity="0.35"/>
  <!-- frame and mullion -->
  <path fill="url(#frame)" fill-rule="evenodd"
        d="M12 7 H52 A5 5 0 0 1 57 12 V52 A5 5 0 0 1 52 57 H12 A5 5 0 0 1 7 52 V12 A5 5 0 0 1 12 7 Z
           M12 12 V52 H30.5 V12 Z M33.5 12 V52 H52 V12 Z"/>
  <!-- right casement swung outwards on its right hinge: the near (free) edge is taller -->
  <path d="M41 5 L52 12 V52 L41 59 Z" class="f-mist"/>
  <path d="M43.4 9.4 L49.8 13.4 V50.6 L43.4 54.6 Z" fill="url(#glassR)"/>
  <path d="M43.4 29 L49.8 22 V27.5 L43.4 34.5 Z" class="f-white" opacity="0.3"/>
  <!-- thickness of the sash on the free edge -->
  <path d="M39.4 6 L41 5 V59 L39.4 58 Z" class="f-sky"/>
</svg>
